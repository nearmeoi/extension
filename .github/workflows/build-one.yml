name: Build one extension

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Gradle path, e.g. :src:id:shinigami'
        required: true
        default: ':src:id:shinigami'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      # No SIGNING_KEY/ALIAS here on purpose: without signingkey.jks the plugin
      # falls back to the debug keystore, so the APK installs but is "untrusted".
      - name: Build
        run: ./gradlew "${{ inputs.module }}:assembleRelease"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: '**/build/outputs/apk/release/*.apk'
          retention-days: 14
